name: flirta
description: "flirta Project"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # Зависимости
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  injectable: ^2.5.1

  # Роутинг
  go_router: ^16.3.0

  # Локализация
  easy_localization: ^3.0.8

  # Работа с сетью
  dio: ^5.8.0+1
  retrofit: ^4.7.0
  internet_connection_checker: ^3.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # База данных
  drift: ^2.25.1
  drift_flutter: ^0.2.4
  sqlite3: ^2.7.3
  path_provider: ^2.1.5

  # Локальное хранилище
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Логированиеc
  logger: ^2.6.1

  # Стейт
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  either_dart: ^1.0.0
  provider: ^6.1.5+1

  # Аналитика

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_crashlytics: ^5.0.4
  firebase_remote_config: ^6.1.1
  firebase_storage: ^13.0.4

  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  step_progress_indicator: ^1.0.2
  flutter_keyboard_visibility: ^6.0.0
  toastification: ^3.0.3
  skeletonizer: ^2.1.0+1
  video_player: ^2.10.0
  loading_animation_widget: ^1.3.0

  flutter_card_swiper:
    path: ./local_packages/flutter_card_swiper
  deepseek_client:
    path: ./local_packages/deepseek_client
  venice_client:
    path: ./local_packages/venice_client

  image_picker: ^1.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.7.0
  json_serializable: ^6.11.1
  build_runner: ^2.10.1
  drift_dev: ^2.27.0
  go_router_builder: ^4.1.1
  flutter_gen_runner: ^5.12.0
  freezed: ^3.2.3
  retrofit_generator: ^10.0.6

  flutter_svg: ^2.2.0
  melos: ^7.1.1

  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter_gen:
  integrations:
    flutter_svg: true
  line_length: 120
  output: lib/generated/

flutter_icons:
  image_path: assets/images/launch/launch_icon.png
  android: true
  ios: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: assets/images/launch/launch_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icons/
    - assets/translations/
    - assets/videos/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
    - family: Logo
      fonts:
        - asset: assets/fonts/Agbalumo-Regular.ttf
          weight: 400

melos:
  packages:
    - .
  scripts:
    clean:
      run: flutter clean
      description: Очистка сборки проекта.

    bootstrap:
      run: flutter pub get
      description: Устанавливает зависимости для всех пакетов.

    generate:
      run: |
        flutter pub run build_runner build --delete-conflicting-outputs
        flutter pub run easy_localization:generate --source-dir assets/translations -f keys -o locale_keys.g.dart
        dart run flutter_native_splash:create
        flutter pub run flutter_launcher_icons
      description: Генерация кода.

    analyze:
      run: flutter analyze
      description: Анализ кода на ошибки.

    format:
      run: dart format . --set-exit-if-changed
      description: Форматирование кода.

    go:
      run: |
        flutter clean
        flutter pub get
        flutter pub run build_runner build --delete-conflicting-outputs
        flutter pub run easy_localization:generate --source-dir assets/translations -f keys -o locale_keys.g.dart
        dart run flutter_native_splash:create
        flutter pub run flutter_launcher_icons
      description: Запускаем все.

    admin_deploy:
      run: |
        flutter build web -t lib/main_admin.dart --release --no-wasm-dry-run
        firebase deploy --only hosting
